# Simple Voice Chat CLIENT config, shipped by Kettle Tech.
#
# Only one key is set here. Everything else Simple Voice Chat needs is written
# with its own defaults the first time the game loads this file (maxhenkel's
# ConfigBuilder appends any missing entry rather than resetting the file), so
# nothing below is being suppressed -- device, volume and keybind settings all
# come up normal and stay yours once you change them.
#
# onboarding_finished: the mod's first-launch setup screen. Verified as the real
# key by reading de/maxhenkel/voicechat/config/ClientConfig.class out of
# voicechat-forge-1.20.1-2.6.22.jar. Set true so a fresh instance drops you into
# the world instead of a microphone wizard. Push-to-talk is already bound to
# Caps Lock in options.txt; if you want to run the wizard anyway it is under
# Options, Voice Chat.
onboarding_finished=true
